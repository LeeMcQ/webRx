name: Radio Bridge APK

# Builds the webRx Radio Bridge Android app (android-bridge/) and, on main,
# publishes it as the "radio-bridge" release so phones can download it from
# https://github.com/LeeMcQ/webRx/releases/download/radio-bridge/webrx-radio-bridge.apk

on:
  push:
    branches: [main, radio-bridge]
    paths:
      - "android-bridge/**"
      - ".github/workflows/radio-bridge.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      - name: Build signed APK
        working-directory: android-bridge
        run: |
          set -o pipefail
          gradle --no-daemon --console=plain assembleRelease 2>&1 | tee build.log

      - name: Report build errors as annotations
        if: failure()
        working-directory: android-bridge
        run: |
          # Java compiler errors with the line that follows (symbol/location).
          grep -A2 -E "error:|What went wrong" build.log | grep -v "^--$" | head -10 | while IFS= read -r line; do
            echo "::error::${line//%/%25}"
          done
          tail -12 build.log | while IFS= read -r line; do echo "::warning::${line//%/%25}"; done

      - name: Collect APK
        run: cp android-bridge/app/build/outputs/apk/release/app-release.apk webrx-radio-bridge.apk

      - uses: actions/upload-artifact@v4
        with:
          name: webrx-radio-bridge
          path: webrx-radio-bridge.apk

      - name: Publish release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES="Android companion app for the webRx MMN monitor: shares this phone's cellular, Wi-Fi, GNSS and Bluetooth measurements with https://leemcq.github.io/webRx/thesis-view.html. Build ${{ github.run_number }} from ${{ github.sha }}."
          if ! gh release view radio-bridge >/dev/null 2>&1; then
            gh release create radio-bridge --title "webRx Radio Bridge (Android)" --notes "$NOTES" --latest=false
          fi
          gh release upload radio-bridge webrx-radio-bridge.apk --clobber
          gh release edit radio-bridge --notes "$NOTES"
          echo "::notice::Published webrx-radio-bridge.apk build ${{ github.run_number }}"
