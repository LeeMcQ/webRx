<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0b1220" />
    <meta name="description" content="Listen to radio in your browser with an RTL-SDR or HackRF. Rust/WebAssembly DSP, installable as an app." />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="icon" type="image/png" href="favicon.png" />
    <link rel="apple-touch-icon" href="icon-192.png" />
    <link rel="manifest" href="manifest.json" />
    <style>
      :root {
        color-scheme: light dark;
        --rr-label-bg-active: #2563eb;
        --rr-label-bg-idle: #475569;
        --rr-window-border-color: #cbd5e1;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --rr-window-background: #0f172a;
          --rr-window-color: #e2e8f0;
          --rr-window-border-color: #1e3a5f;
          --rr-label-bg-active: #1d4ed8;
          --rr-label-bg-idle: #334155;
        }
        body {
          background: #0b1220;
          color: #e2e8f0;
        }
      }
      body {
        margin: 0;
        height: 100dvh;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
      }
      #boot {
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 12px;
        opacity: 0.7;
      }
      #boot img {
        width: 48px;
        height: 48px;
      }
    </style>
    <script src="main.js"></script>
    <title>Radio Receiver</title>
  </head>
  <body>
    <div id="boot"><img src="icon-192.png" alt="" /> Loading radio…</div>
  </body>
</html>
